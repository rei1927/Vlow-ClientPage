version: '3.8'

services:
  # Client (Frontend)
  client:
    build: ./client
    image: custom_vlow_client:v2
    container_name: vlow_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

  # Server (Backend)
  server:
    build: ./server
    image: custom_vlow_server:v2
    container_name: vlow_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Database (Supabase)
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_SSL=true
      # MinIO (Internal Network)
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-vlow-agents}
      # JWT
      - JWT_SECRET=${JWT_SECRET:-rahasia_aman}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      # WAHA Connectivity
      - WAHA_BASE_URL=${WAHA_BASE_URL:-https://waha-plus.dayamedialangit.co.id}
      - WAHA_API_KEY=${WAHA_API_KEY}
      # Simulator
      - N8N_SIMULATOR_URL=${N8N_SIMULATOR_URL}
      # Meta Cloud API
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-vlow_meta_webhook_secret_2024}
      # Email Configuration (AWS SES)
      - SMTP_HOST=${SMTP_HOST:-email-smtp.ap-southeast-1.amazonaws.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_NAME=${FROM_NAME:-Vlow System Admin}
      - FROM_EMAIL=${FROM_EMAIL:-no-reply@vlow.ai}
    depends_on:
      - minio

  # MinIO (Object Storage)
  minio:
    image: minio/minio
    container_name: vlow_minio
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "9005:9000"
      - "9006:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data

volumes:
  minio_data:
