version: '3.8'

services:
  # Client (Frontend)
  client:
    build: ./client
    image: custom_vlow_client:v2
    container_name: vlow_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

  # Server (Backend)
  server:
    build: ./server
    image: custom_vlow_server:v2
    container_name: vlow_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Database (Supabase)
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_SSL=true
      # MinIO (External Network)
      - MINIO_ENDPOINT=minio-api.dayamedialangit.co.id
      - MINIO_PORT=443
      - MINIO_USE_SSL=true
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-rahasia123}
      - MINIO_BUCKET=${MINIO_BUCKET:-vlow-client}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-https://minio.dayamedialangit.co.id}
      # JWT
      - JWT_SECRET=${JWT_SECRET:-rahasia_aman}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      # WAHA Connectivity
      - WAHA_BASE_URL=${WAHA_BASE_URL:-https://waha-plus.dayamedialangit.co.id}
      - WAHA_API_KEY=${WAHA_API_KEY:-rahasia123}
      # Simulator
      - N8N_SIMULATOR_URL=${N8N_SIMULATOR_URL}
      # Meta Cloud API
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-vlow_rahasia_webhook_2026}
      # Email Configuration (Resend)
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_EMAIL=${SMTP_EMAIL:-resend}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-re_DVhzLzW4_3Y7mDXR9KwfoA8iMhhzPgYGS}
      - FROM_NAME=${FROM_NAME:-Vlow System Admin}
      - FROM_EMAIL=${FROM_EMAIL:-no-reply@vlow.ai}
      # WAHA Webhook Proxy (WAHA reaches backend via public Nginx proxy)
      - WAHA_WEBHOOK_PROXY_URL=${WAHA_WEBHOOK_PROXY_URL}
    depends_on:
      - minio
      - postgres

  # Database (PostgreSQL Local)
  postgres:
    image: postgres:17-alpine
    container_name: vlow_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=vlow
      - POSTGRES_PASSWORD=vlow_secret
      - POSTGRES_DB=vlow_db
    volumes:
      - postgres_data_17:/var/lib/postgresql/data

  # Database Migrator (Temporary service to copy Supabase -> Local)
  db_migrator:
    image: postgres:17-alpine
    container_name: vlow_db_migrator
    depends_on:
      - postgres
    environment:
      - PGPASSWORD=${DB_PASS}
    command: >
      sh -c "until pg_isready -h postgres -p 5432 -U vlow; do echo 'Waiting for local postgres...'; sleep 2; done; echo 'Starting Migration from Supabase to Local...' && pg_dump -h ${DB_HOST} -p 5432 -U ${DB_USER} -d ${DB_NAME} -F p --clean --if-exists | PGPASSWORD=vlow_secret psql -h postgres -p 5432 -U vlow -d vlow_db && echo 'MIGRATION_COMPLETE' || echo 'MIGRATION_FAILED'"

  # MinIO (Object Storage)
  minio:
    image: minio/minio
    container_name: vlow_minio
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "9005:9000"
      - "9006:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data

volumes:
  minio_data:
  postgres_data:
  postgres_data_17:
